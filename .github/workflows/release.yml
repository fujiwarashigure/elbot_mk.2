name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Go race tests for critical packages
        run: go test -race ./internal/agent ./internal/app ./internal/config ./internal/storage/... ./internal/angelmemory ./internal/selflearning ./internal/groupanalysis ./internal/health ./internal/ratelimit ./internal/safecontext ./internal/textmatch


  deploy:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install script test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 python3 shellcheck

      - name: ShellCheck deployment scripts
        run: shellcheck -S error deploy/*.sh deploy/tests/*.sh

      - name: Deployment script regression
        env:
          REQUIRE_TEST_DEPS: "1"
        run: |
          bash deploy/tests/backup_restart_test.sh
          bash deploy/tests/backup_restore_test.sh
          bash deploy/tests/restore_verify_start_test.sh
          bash deploy/tests/rollback_script_test.sh
          bash deploy/tests/upgrade_script_test.sh
          bash deploy/tests/watchdog_redaction_test.sh
          bash deploy/tests/windows_script_test.sh

  windows-test:
    name: Windows native tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Windows service marker test
        run: go test ./internal/app -run TestServiceMarkerNamedMutexConcurrentClaim -count=1

      - name: Windows native package tests
        run: go test ./internal/safecontext/... ./internal/textmatch/... ./internal/ratelimit/... ./internal/angelmemory/... ./internal/selflearning/... ./internal/groupanalysis/... -count=1


  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: github.event_name == 'push'
    needs: [test, deploy, windows-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "elbot${{ matrix.ext }}" ./cmd/elbot

      - name: Archive
        run: |
          mkdir -p assets
          archive="elbot-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "assets/${archive}.zip" "elbot${{ matrix.ext }}"
          else
            tar czf "assets/${archive}.tar.gz" elbot
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: elbot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: assets

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect assets
        run: |
          mkdir -p release-assets
          echo "--- dist contents ---"
          ls -la dist 2>/dev/null || echo "(dist missing)"
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \; 2>/dev/null || true
          echo "--- release-assets contents ---"
          ls -la release-assets
          if [ -z "$(ls -A release-assets 2>/dev/null)" ]; then
            echo "ERROR: no artifacts found in dist" >&2
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 sha256sum \
            | sed 's|  \./|  |' > SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME}"
          extract_section() {
            local file="$1"
            awk -v tag="$tag" '
              /^## \[/ {
                header=$0
                sub(/^## \[/, "", header)
                sub(/\].*/, "", header)
                sub(/ - .*/, "", header)
                f = (header == tag)
              }
              f { print }
            ' "$file"
          }
          zh_notes=$(extract_section CHANGELOG.md)
          if [ -z "$zh_notes" ]; then
            echo "ERROR: CHANGELOG.md has no section for ${tag}." >&2
            exit 1
          fi

          # 英文 release notes 是「可选」的：翻译依赖外部 LLM（Translate user docs workflow），
          # 它失败或延迟不应该阻塞发版。优先取 tag 内的 CHANGELOG.en.md，其次尝试 main 上
          # 的最新版本（翻译 bot 可能已经提交），两者都没有就退回纯中文说明。
          en_notes=""
          en_source=""
          if [ -f CHANGELOG.en.md ]; then
            en_notes=$(extract_section CHANGELOG.en.md)
            if [ -n "$en_notes" ]; then
              en_source="tag"
            fi
          fi

          if [ -z "$en_notes" ]; then
            if git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main && \
               git show origin/main:CHANGELOG.en.md > /tmp/CHANGELOG.en.md 2>/dev/null; then
              en_notes=$(extract_section /tmp/CHANGELOG.en.md)
              if [ -n "$en_notes" ]; then
                en_source="origin/main"
              fi
            fi
          fi

          if [ -n "$en_notes" ]; then
            echo "Using English release notes from ${en_source}."
            printf '%s\n\n---\n\n%s\n' "$zh_notes" "$en_notes" > release-notes.md
          else
            echo "::warning::No English CHANGELOG section for ${tag}; publishing Chinese-only release notes. Configure TRANSLATE_LLM_API_KEY / TRANSLATE_LLM_BASE_URL / TRANSLATE_LLM_MODEL to enable translations."
            printf '%s\n' "$zh_notes" > release-notes.md
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--notes-file release-notes.md)
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc|pre) ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.tar.gz release-assets/*.zip release-assets/SHA256SUMS \
            "${args[@]}"
