# ============================================================
# ElBot 宝塔 Nginx 反向代理片段
#
# 用法一（推荐）：
#   宝塔面板 -> 网站 -> 添加站点（你的域名）-> 设置 -> SSL 申请 Let's Encrypt
#   -> 反向代理，添加：
#       代理目录 /cli/v1/ws   目标 http://127.0.0.1:32172
#       代理目录 /elvena/     目标 http://127.0.0.1:32170
#       代理目录 /healthz     目标 http://127.0.0.1:32170
#
# 用法二：
#   把下面内容粘贴到
#   /www/server/panel/vhost/nginx/你的域名.conf 的 server {} 内，
#   然后 nginx -t && systemctl reload nginx
#
# 前置条件：
#   - app.toml [platform.cli.server] enabled=true, listen="0.0.0.0:32172"
#   - elnis.toml enabled=true, [http] addr="0.0.0.0:32170"
#   - 容器端口只映射到宿主机 127.0.0.1
# ============================================================

# ---------- CLI 远程 WebSocket ----------
# 客户端连接：wss://你的域名/cli/v1/ws
location /cli/v1/ws {
    proxy_pass http://127.0.0.1:32172;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ---------- Elnis 事件入口 ----------
# 外部程序投递：https://你的域名/elvena/v3/events
location /elvena/ {
    proxy_pass http://127.0.0.1:32170;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 32m;
}

# ---------- Elnis 健康检查（可选，方便云监控探活） ----------
location = /elbot/healthz {
    proxy_pass http://127.0.0.1:32170/healthz;
    access_log off;
    # 只允许本机/内网探活；如需公网监控可删除 allow/deny
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}
