# ElBot 单机常驻服务（Docker Compose）
#
# 使用：
#   cd deploy
#   cp .env.example .env   # 填写密钥
#   docker compose build
#   docker compose up -d
#
# Windows 本地 Docker Desktop 用户可改用：
#   .\deploy\windows\elbot.ps1 init
#   .\deploy\windows\elbot.ps1 start
#
# 说明：
# - 只映射到宿主机 127.0.0.1，公网访问统一走宝塔 Nginx 反向代理。
# - 数据持久化在 ./data，备份直接打包该目录即可。
# - 单实例运行，请勿 scale，也不要在多台机器共享同一个 ./data。

services:
  elbot:
    image: ${ELBOT_IMAGE:-elbot:0.6.6}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ${ELBOT_BUILD_TARGET:-runtime}   # runtime 或 go-runtime
      args:
        GO_VERSION: ${GO_VERSION:-1.26}
        VERSION: ${ELBOT_VERSION:-0.6.6}
        # 基础镜像（可覆盖成国内加速路径 / pin digest）。默认值必须非空，
        # 否则 ${VAR:-} 展开成空串会把 FROM 变成 ":1.26-bookworm" 而直接报错。
        GO_BASE_IMAGE: ${GO_BASE_IMAGE:-golang}
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-debian:bookworm-slim}
        # 追加更多系统命令（默认列表在 Dockerfile 内，只增不减）
        EXTRA_TOOLS: ${EXTRA_TOOLS:-}
        # Go 模块代理：国内直连 proxy.golang.org 会超时
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        # apt 镜像主机名：国内构建必设，否则走 deb.debian.org（实测仅十几 KB/s）
        # 可选 mirrors.aliyun.com / mirrors.cloud.tencent.com / mirrors.ustc.edu.cn
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: elbot
    hostname: elbot
    # 镜像内同样以 10001:10001 运行；这里显式写死，避免换镜像后 UID 漂移导致数据卷不可写
    user: "10001:10001"

    # 崩溃/重启/宿主机重启后自动拉起；配合下方 systemd 单元可确保开机即启动
    restart: unless-stopped

    # ElBot 收到 SIGTERM 后最多需要约 30s 优雅关闭
    stop_grace_period: 40s

    # 不再需要 docker 的 --init，镜像内 tini 已作为 PID 1
    init: false

    # 密钥和 token 全部通过 .env 注入，不要写进配置文件
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data
      # 缓存（Go Skill 编译、媒体处理临时文件）也放在数据卷上，重建容器后仍可用
      XDG_CACHE_HOME: /data/cache
      XDG_RUNTIME_DIR: /data/run
      # 独立运维健康接口：仅监听容器内部，宿主机只映射到 127.0.0.1
      ELBOT_HEALTH_ADDR: ${ELBOT_HEALTH_ADDR:-0.0.0.0:32171}
      ELBOT_HEALTH_LIVE_STALE_SECONDS: ${ELBOT_HEALTH_LIVE_STALE_SECONDS:-90}
      # 不要在这里无条件设置 ELBOT_GO_BINARY，否则空值会覆盖 go-runtime 镜像里的默认值；
      # 如使用 go-runtime，镜像内已设置 /usr/local/go/bin/go；需要自定义时写到 .env 即可。

    volumes:
      - ./data:/data

    # QQ OneBot 跑在宿主机时，取消下面两行注释，并把 app.toml 的 ws_url 写成
    # ws://host.docker.internal:6700/；OneBot 在同一 Compose 项目时直接用服务名即可。
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # 只监听宿主机回环地址；公网入口由宝塔 Nginx 反代 + TLS 提供
    # 32172: CLI 远程 WebSocket 服务端（app.toml 中 platform.cli.server.enabled=true 时生效）
    # 32171: 独立应用健康接口，不依赖 Elnis。
    # 32170: Elnis 事件 HTTP 入口（elnis.toml enabled=true 时生效）。ElBot 默认不启用 Elnis，
    #        不使用 Elnis 时映射没有意义，且 /healthz 不能代表 ElBot / 模型 / OneBot 健康；
    #        请删除或注释这一行。
    ports:
      - "127.0.0.1:32172:32172"
      - "127.0.0.1:32171:32171"   # 独立健康接口 /live /ready /healthz
      - "127.0.0.1:32170:32170"

    # 2 核 4G 机器上限制资源，避免异常时拖垮宝塔和其他站点
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 512

    # Agent 会派生 shell / hook / worker 子进程，文件描述符给足
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # 只禁提权，不 cap_drop / 不加 read_only：
    # Agent 的 shell 工具依赖容器内完整命令（ping 需要 NET_RAW 等），
    # 过度收窄 capability 会直接砍掉工具能力。
    security_opt:
      - no-new-privileges:true

    # 限制容器 stdout 日志大小，防止 40G 磁盘被 Docker 日志写满
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
