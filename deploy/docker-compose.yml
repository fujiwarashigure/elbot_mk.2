# ElBot 单机常驻服务（Docker Compose）
#
# 使用：
#   cd deploy
#   cp .env.example .env   # 填写密钥
#   docker compose build
#   docker compose up -d
#
# 说明：
# - 只映射到宿主机 127.0.0.1，公网访问统一走宝塔 Nginx 反向代理。
# - 数据持久化在 ./data，备份直接打包该目录即可。
# - 单实例运行，请勿 scale，也不要在多台机器共享同一个 ./data。

services:
  elbot:
    image: ${ELBOT_IMAGE:-elbot:0.5.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ${ELBOT_BUILD_TARGET:-runtime}   # runtime 或 go-runtime
      args:
        GO_VERSION: ${GO_VERSION:-1.26}
        VERSION: ${ELBOT_VERSION:-0.5.0}
    container_name: elbot
    hostname: elbot
    # 镜像内同样以 10001:10001 运行；这里显式写死，避免换镜像后 UID 漂移导致数据卷不可写
    user: "10001:10001"

    # 崩溃/重启/宿主机重启后自动拉起；配合下方 systemd 单元可确保开机即启动
    restart: unless-stopped

    # ElBot 收到 SIGTERM 后最多需要约 30s 优雅关闭
    stop_grace_period: 40s

    # 不再需要 docker 的 --init，镜像内 tini 已作为 PID 1
    init: false

    # 密钥和 token 全部通过 .env 注入，不要写进配置文件
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data
      XDG_RUNTIME_DIR: /data/run
      # 独立运维健康接口：仅监听容器内部，宿主机只映射到 127.0.0.1
      ELBOT_HEALTH_ADDR: ${ELBOT_HEALTH_ADDR:-0.0.0.0:32171}
      ELBOT_HEALTH_LIVE_STALE_SECONDS: ${ELBOT_HEALTH_LIVE_STALE_SECONDS:-90}
      # 不要在这里无条件设置 ELBOT_GO_BINARY，否则空值会覆盖 go-runtime 镜像里的默认值；
      # 如使用 go-runtime，镜像内已设置 /usr/local/go/bin/go；需要自定义时写到 .env 即可。

    volumes:
      - ./data:/data

    # QQ OneBot 跑在宿主机时，取消下面两行注释，并把 app.toml 的 ws_url 写成
    # ws://host.docker.internal:6700/；OneBot 在同一 Compose 项目时直接用服务名即可。
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # 只监听宿主机回环地址；公网入口由宝塔 Nginx 反代 + TLS 提供
    # 32172: CLI 远程 WebSocket 服务端（app.toml 中 platform.cli.server.enabled=true 时生效）
    # 32171: 独立应用健康接口，不依赖 Elnis。
    # 32170: Elnis 事件 HTTP 入口（elnis.toml enabled=true 时生效）。ElBot 默认不启用 Elnis，
    #        不使用 Elnis 时映射没有意义，且 /healthz 不能代表 ElBot / 模型 / OneBot 健康；
    #        请删除或注释这一行。
    ports:
      - "127.0.0.1:32172:32172"
      - "127.0.0.1:32171:32171"   # 独立健康接口 /live /ready /healthz
      - "127.0.0.1:32170:32170"

    # 2 核 4G 机器上限制资源，避免异常时拖垮宝塔和其他站点
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 512

    security_opt:
      - no-new-privileges:true

    # 限制容器 stdout 日志大小，防止 40G 磁盘被 Docker 日志写满
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
